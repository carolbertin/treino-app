<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volumes — Painel do Professor</title>
<style>
  :root {
    --font-sans: 'DM Sans', system-ui, sans-serif;
    --color-bg: #0f0f10;
    --color-surface: #181819;
    --color-border: rgba(255,255,255,0.07);
    --color-border-mid: rgba(255,255,255,0.1);
    --color-text-primary: #f0eff2;
    --color-text-secondary: #8b8a90;
    --color-text-tertiary: #4a4950;
    --color-bar-prescrito: #7F77DD;
    --color-bar-realizado: #1D9E75;
    --color-track: rgba(255,255,255,0.05);
    --radius-card: 14px;
    --radius-toggle: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--color-bg);
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }

  .page {
    max-width: 780px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .header-name {
    font-size: 17px;
    font-weight: 500;
    color: var(--color-text-primary);
    letter-spacing: -0.01em;
  }
  .header-sub {
    font-size: 13px;
    color: var(--color-text-tertiary);
  }

  /* Card */
  .card {
    background: var(--color-surface);
    border: 0.5px solid var(--color-border);
    border-radius: var(--radius-card);
    padding: 1.125rem 1.375rem;
    margin-bottom: 1rem;
  }
  .card-title {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-text-tertiary);
    margin-bottom: 1.125rem;
  }

  /* Toggles */
  .toggle-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 1.375rem;
  }
  .toggle-btn {
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 400;
    padding: 4px 13px;
    border-radius: var(--radius-toggle);
    border: 0.5px solid var(--color-border-mid);
    background: rgba(255,255,255,0.04);
    color: var(--color-text-primary);
    cursor: pointer;
    transition: all .15s ease;
    user-select: none;
    outline: none;
  }
  .toggle-btn:hover {
    background: rgba(255,255,255,0.08);
  }
  .toggle-btn.off {
    background: transparent;
    color: var(--color-text-tertiary);
    border-color: rgba(255,255,255,0.04);
    text-decoration: line-through;
  }

  /* Legenda */
  .legenda {
    display: flex;
    gap: 16px;
    margin-bottom: 1.375rem;
  }
  .legenda-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--color-text-secondary);
  }
  .legenda-dot {
    width: 10px;
    height: 6px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* Barras */
  .bar-group {
    margin-bottom: 13px;
  }
  .bar-group:last-child { margin-bottom: 0; }

  .bar-grupo-label {
    font-size: 13px;
    color: var(--color-text-primary);
    margin-bottom: 6px;
    font-weight: 400;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 3px;
  }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-type {
    font-size: 11px;
    color: var(--color-text-tertiary);
    width: 62px;
    flex-shrink: 0;
    text-align: right;
  }
  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--color-track);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width .35s cubic-bezier(.4,0,.2,1);
    min-width: 4px;
  }
  .bar-val {
    font-size: 12px;
    color: var(--color-text-secondary);
    width: 22px;
    text-align: right;
    flex-shrink: 0;
  }

  /* Separador entre grupos */
  .bar-sep {
    height: 0.5px;
    background: var(--color-border);
    margin: 10px 0 13px;
  }
  .bar-sep:last-child { display: none; }

  /* Responsivo */
  @media (max-width: 520px) {
    body { padding: 1.25rem 1rem; }
    .bar-type { width: 52px; font-size: 10px; }
    .header-name { font-size: 15px; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-name">Volumes — João Silva</div>
    <div class="header-sub">6 treinos prescritos</div>
  </div>

  <div class="card">
    <div class="card-title">Simular semana — treinos ativos</div>
    <div class="toggle-row" id="toggles"></div>
    <div class="legenda">
      <div class="legenda-item">
        <div class="legenda-dot" style="background:var(--color-bar-prescrito);"></div>
        Prescrito
      </div>
      <div class="legenda-item">
        <div class="legenda-dot" style="background:var(--color-bar-realizado);"></div>
        Realizado
      </div>
    </div>
    <div id="bars"></div>
  </div>

</div>

<script>
const treinos = [
  { id: 0, nome: 'Treino A', grupos: [
    { nome: 'Quadríceps', prescrito: 12, realizado: 10 },
    { nome: 'Posterior',  prescrito: 6,  realizado: 4  },
    { nome: 'Glúteo',     prescrito: 4,  realizado: 4  },
  ]},
  { id: 1, nome: 'Treino B', grupos: [
    { nome: 'Peito',   prescrito: 9, realizado: 9 },
    { nome: 'Ombro',   prescrito: 6, realizado: 4 },
    { nome: 'Tríceps', prescrito: 5, realizado: 5 },
  ]},
  { id: 2, nome: 'Treino C', grupos: [
    { nome: 'Costas', prescrito: 10, realizado: 8 },
    { nome: 'Bíceps', prescrito: 8,  realizado: 8 },
    { nome: 'Core',   prescrito: 4,  realizado: 0 },
  ]},
  { id: 3, nome: 'Treino D', grupos: [
    { nome: 'Glúteo', prescrito: 10, realizado: 10 },
    { nome: 'Ombro',  prescrito: 8,  realizado: 6  },
    { nome: 'Costas', prescrito: 8,  realizado: 8  },
  ]},
  { id: 4, nome: 'FB 1', grupos: [
    { nome: 'Quadríceps', prescrito: 6, realizado: 0 },
    { nome: 'Peito',      prescrito: 5, realizado: 0 },
    { nome: 'Costas',     prescrito: 5, realizado: 0 },
  ]},
  { id: 5, nome: 'FB 2', grupos: [
    { nome: 'Glúteo',    prescrito: 6, realizado: 0 },
    { nome: 'Ombro',     prescrito: 4, realizado: 0 },
    { nome: 'Posterior', prescrito: 4, realizado: 0 },
  ]},
];

const ativos = new Set([0, 1, 2, 3, 4, 5]);

function calcVolume() {
  const vol = {};
  treinos.forEach(t => {
    if (!ativos.has(t.id)) return;
    t.grupos.forEach(g => {
      if (!vol[g.nome]) vol[g.nome] = { prescrito: 0, realizado: 0 };
      vol[g.nome].prescrito += g.prescrito;
      vol[g.nome].realizado += g.realizado;
    });
  });
  return vol;
}

function renderBars() {
  const vol = calcVolume();
  const entries = Object.entries(vol).sort((a, b) => b[1].prescrito - a[1].prescrito);
  const max = Math.max(...entries.map(([, v]) => v.prescrito), 1);
  const bc = document.getElementById('bars');

  if (entries.length === 0) {
    bc.innerHTML = '<div style="font-size:13px;color:var(--color-text-tertiary);padding:4px 0;">Nenhum treino ativo.</div>';
    return;
  }

  bc.innerHTML = entries.map(([grupo, v], i) => {
    const pp = Math.max(Math.round(v.prescrito / max * 100), v.prescrito > 0 ? 2 : 0);
    const rp = Math.max(Math.round(v.realizado / max * 100), v.realizado > 0 ? 2 : 0);
    const sep = i < entries.length - 1 ? '<div class="bar-sep"></div>' : '';
    return `
      <div class="bar-group">
        <div class="bar-grupo-label">${grupo}</div>
        <div class="bar-row">
          <div class="bar-type">prescrito</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pp}%;background:var(--color-bar-prescrito);"></div>
          </div>
          <div class="bar-val">${v.prescrito}</div>
        </div>
        <div class="bar-row">
          <div class="bar-type">realizado</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${rp}%;background:var(--color-bar-realizado);"></div>
          </div>
          <div class="bar-val">${v.realizado}</div>
        </div>
      </div>${sep}`;
  }).join('');
}

function renderToggles() {
  const tr = document.getElementById('toggles');
  tr.innerHTML = '';
  treinos.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'toggle-btn' + (ativos.has(t.id) ? '' : ' off');
    btn.textContent = t.nome;
    btn.setAttribute('aria-pressed', ativos.has(t.id) ? 'true' : 'false');
    btn.onclick = () => {
      if (ativos.has(t.id)) ativos.delete(t.id);
      else ativos.add(t.id);
      btn.className = 'toggle-btn' + (ativos.has(t.id) ? '' : ' off');
      btn.setAttribute('aria-pressed', ativos.has(t.id) ? 'true' : 'false');
      renderBars();
    };
    tr.appendChild(btn);
  });
}

renderToggles();
renderBars();
</script>
</body>
</html>
